# 三平台打包：Windows exe / macOS（Intel + Apple Silicon）/ Linux
# 触发方式：Actions 页面手动 Run，或推 v* 标签（自动发 GitHub Release）
#
# 为什么 Linux 要在 manylinux2014 容器里构建：PyInstaller 产物绑构建机的 glibc 版本，
# 直接在 ubuntu-latest 上出的二进制到 CentOS 7 上跑不起来；manylinux2014 底座是
# CentOS 7，出的单个二进制兼容 CentOS 7+ / Ubuntu 18.04+ / Debian 10+。
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml pyinstaller
      - run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: ChromeGoPanel-windows-x64
          path: dist/ChromeGoPanel-windows-x64.exe

  macos:
    strategy:
      matrix:
        include:
          - { os: macos-13, arch: x64 }      # Intel
          - { os: macos-14, arch: arm64 }    # Apple Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml pyinstaller
      - run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: ChromeGoPanel-macos-${{ matrix.arch }}
          path: dist/ChromeGoPanel-macos-${{ matrix.arch }}

  linux:
    # 不能整个 job 跑在 manylinux 容器里：runner 的 node24 要求 glibc 2.28+，而
    # manylinux2014（CentOS 7 底座）只有 2.17，连 actions/checkout 都起不来。
    # 所以 checkout/上传在宿主机，只把编译这一步放进容器。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build in manylinux2014（glibc 2.17，兼容 CentOS 7+ / Ubuntu 18.04+ / Debian 10+）
        run: |
          docker run --rm -v "$PWD:/io" quay.io/pypa/manylinux2014_x86_64 bash -c '
            set -e
            PY=$(ls /opt/python/cp312*/bin/python3 | head -1)
            $PY -m pip install pyyaml pyinstaller
            cd /io && $PY build.py
          '
          sudo chown -R "$(id -u):$(id -g)" dist   # 容器里 root 写的，宿主机上传前改回属主
      - uses: actions/upload-artifact@v4
        with:
          name: ChromeGoPanel-linux-x64
          path: dist/ChromeGoPanel-linux-x64

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true, path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/ChromeGoPanel-*
